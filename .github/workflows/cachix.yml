name: Build and push to Cachix

on:
  push:
    branches:
      - feat/global-workspace-indices-rb
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/feat/global-workspace-indices-rb'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: haug1
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Niri
        run: nix build .#niri
