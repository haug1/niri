name: Build and push to Cachix

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: haug1-niri
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Niri
        run: nix build .#niri
